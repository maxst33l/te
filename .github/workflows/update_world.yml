name: Daily Downloader

on:
  schedule:
    # Runs automatically every day at 4:00 AM UTC
    - cron: '45 */6 * * *'
  workflow_dispatch: # Allows you to run it manually anytime

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download File
        run: |
          # Create a directory if needed
          mkdir -p docs
          # Download the file, follow redirects (-L), and save it as guide.xml.gz
          curl -L "${{ secrets.WORLD }}" -o docs/world.xml.gz

      - name: Commit and Push Changes
        run: |
          git config --global user.name "World Bot"
          git config --global user.email "world-bot@github.com"
          git add docs/world.xml.gz
          if git diff-index --quiet HEAD; then
            echo "STATUS: world.xml.gz is unchanged. Skipping commit."
          else
            echo "STATUS: world.xml.gz was updated! Committing and pushing..."
            git commit -m "Scheduled update"
            git push
          fi

